<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- TurabIQ Favicon / App Icon
       Simplified for small sizes (16x16 to 256x256)
       Works as browser favicon, iOS/Android app icon, or social avatar
  -->
  
  <!-- Outer circle (optional, can be removed for square crop) -->
  <circle cx="32" cy="32" r="31" fill="#FAFAF8" stroke="#E8DCC8" stroke-width="0.5"/>
  
  <!-- Stratified Earth Layers -->
  <!-- Layer 1 (bottom) -->
  <ellipse cx="32" cy="45" rx="18" ry="4" fill="#D4A574" opacity="0.95"/>
  <path d="M 18 45 Q 18 43 32 42 Q 46 43 46 45" fill="#D4A574" opacity="0.7"/>
  
  <!-- Layer 2 (middle) -->
  <ellipse cx="32" cy="32" rx="16" ry="3.5" fill="#C29A6B" opacity="0.85"/>
  <path d="M 18 32 Q 18 30 32 29 Q 46 30 46 32" fill="#C29A6B" opacity="0.65"/>
  
  <!-- Layer 3 (top) -->
  <ellipse cx="32" cy="20" rx="14" ry="3" fill="#A0826D" opacity="0.75"/>
  <path d="M 20 20 Q 20 18 32 17 Q 44 18 44 20" fill="#A0826D" opacity="0.6"/>
  
  <!-- Ascending Signal Line (deep teal) -->
  <g stroke="#1B7B7F" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 32 48 L 31 44 L 32 40 L 33 36 L 32 32 L 31 28 L 32 24 L 33 20"/>
  </g>
  
  <!-- Sensor indicator dot -->
  <circle cx="32" cy="18" r="1.2" fill="#1B7B7F"/>
</svg>
